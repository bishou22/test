<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyeux Anniversaire 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bordeaux:#4a0e1a;
  --bordeaux-2:#6d1426;
  --rouge:#9b1c31;
  --rose:#e8a0ab;
  --or:#e3b66a;
  --creme:#fff4ec;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins',sans-serif;color:var(--creme);
  background:radial-gradient(circle at 20% 10%,var(--bordeaux-2),var(--bordeaux) 60%,#2a0710);
  background-attachment:fixed;overflow-x:hidden;
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
#petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-40px;opacity:.7;animation:fall linear infinite}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg) translateX(60px)}
}
section{position:relative;z-index:1;padding:90px 20px;max-width:1000px;margin:auto;text-align:center}
h1,h2{font-family:'Great Vibes',cursive;font-weight:400}
h2{font-size:clamp(2.6rem,7vw,4rem);color:var(--or);margin-bottom:30px}

/* reveal */
.reveal{opacity:0;transform:translateY(40px);transition:1s ease}
.reveal.show{opacity:1;transform:none}

/* HERO */
#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px}
.sub{letter-spacing:.4em;text-transform:uppercase;font-size:.85rem;color:var(--rose);animation:fade 2s both}
#hero h1{
  font-size:clamp(3.5rem,13vw,8rem);line-height:1.05;
  background:linear-gradient(90deg,var(--or),#fff,var(--or));background-size:200%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 4s linear infinite, pop 1.4s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes shine{to{background-position:200% 0}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(-15px)}}
.name{font-family:'Great Vibes',cursive;font-size:clamp(2rem,6vw,3.5rem);color:var(--rose);animation:fade 2s .6s both}
.age{
  width:110px;height:110px;border-radius:50%;display:grid;place-items:center;
  font-size:2.6rem;font-weight:600;border:2px solid var(--or);color:var(--or);
  box-shadow:0 0 30px rgba(227,182,106,.4);animation:beat 1.6s infinite;
}
@keyframes beat{50%{transform:scale(1.1);box-shadow:0 0 50px rgba(227,182,106,.7)}}
#countdown{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.cd{background:rgba(255,255,255,.07);border:1px solid rgba(227,182,106,.3);backdrop-filter:blur(6px);
  border-radius:16px;padding:14px 18px;min-width:78px}
.cd b{display:block;font-size:1.8rem;color:var(--or)}
.cd span{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;opacity:.8}
.btn{
  margin-top:10px;background:linear-gradient(135deg,var(--rouge),var(--bordeaux-2));color:#fff;
  border:1px solid var(--or);padding:14px 34px;border-radius:40px;font:600 1rem 'Poppins';cursor:pointer;
  transition:.3s;box-shadow:0 8px 25px rgba(0,0,0,.4)
}
.btn:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 12px 35px rgba(155,28,49,.7)}
.scroll{position:absolute;bottom:25px;font-size:1.6rem;animation:bounce 1.8s infinite;color:var(--or)}
@keyframes bounce{50%{transform:translateY(12px)}}

/* CALENDAR */
.cal{max-width:430px;margin:auto;background:rgba(255,244,236,.06);border:1px solid rgba(227,182,106,.35);
  border-radius:24px;padding:24px;backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.cal-head{font-size:1.3rem;letter-spacing:.2em;text-transform:uppercase;color:var(--or);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dow{font-size:.75rem;color:var(--rose);padding-bottom:6px}
.day{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:.95rem;position:relative;transition:.3s}
.day:hover{background:rgba(255,255,255,.1)}
.day.past{opacity:.35}
.day.bday{
  background:radial-gradient(circle,var(--rouge),var(--bordeaux-2));color:#fff;font-weight:600;
  border:2px solid var(--or);animation:pulse 1.5s infinite;cursor:pointer
}
.day.bday::after{content:'🎂';position:absolute;top:-14px;right:-10px;font-size:1.2rem;animation:wiggle 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,182,106,.7)}100%{box-shadow:0 0 0 18px rgba(227,182,106,0)}}
@keyframes wiggle{50%{transform:rotate(20deg) scale(1.2)}}

/* CAKE */
.cake{position:relative;width:230px;margin:50px auto 10px;cursor:pointer}
.layer{height:50px;border-radius:12px;position:relative}
.l1{width:230px;background:var(--rouge)}
.l2{width:180px;margin:0 auto;background:var(--bordeaux-2);border:1px solid var(--or)}
.l3{width:130px;margin:0 auto;background:var(--rose)}
.layer::before{content:'';position:absolute;top:0;left:0;right:0;height:16px;
  background:var(--creme);border-radius:12px 12px 30px 30px;opacity:.9}
.candles{display:flex;justify-content:center;gap:22px;margin-bottom:-2px}
.candle{width:10px;height:42px;background:linear-gradient(var(--or),#fff);border-radius:4px;position:relative}
.flame{position:absolute;left:50%;top:-24px;width:14px;height:22px;margin-left:-7px;
  background:radial-gradient(ellipse at 50% 70%,#fff,#ffb347 50%,#ff4d00);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flick .25s infinite alternate;transform-origin:bottom;
  filter:drop-shadow(0 0 8px #ffb347)}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
.out .flame{opacity:0;transition:.6s}
.hint{opacity:.7;font-size:.9rem;margin-top:14px}

/* GALLERY */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:36px;padding:10px}
.polaroid{background:var(--creme);color:#3a0a14;padding:12px 12px 16px;border-radius:6px;
  box-shadow:0 14px 30px rgba(0,0,0,.5);transition:.4s;cursor:zoom-in;
  transform:rotate(var(--r))}
.polaroid:hover{transform:rotate(0) scale(1.07);z-index:3}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:3px}
.polaroid p{font-family:'Great Vibes',cursive;font-size:1.6rem;margin-top:8px}
#lightbox{position:fixed;inset:0;background:rgba(20,2,6,.92);display:none;place-items:center;z-index:100;cursor:zoom-out}
#lightbox.on{display:grid}
#lightbox img{max-width:92vw;max-height:88vh;border-radius:10px;border:6px solid var(--creme);animation:pop .5s}

/* MESSAGE */
.card{max-width:640px;margin:auto;background:rgba(255,244,236,.07);border:1px solid rgba(227,182,106,.4);
  border-radius:24px;padding:40px 30px;line-height:1.9;font-size:1.05rem;min-height:260px}
.card .caret{display:inline-block;width:2px;height:1.1em;background:var(--or);vertical-align:middle;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
footer{position:relative;z-index:1;text-align:center;padding:50px 20px;opacity:.7;font-size:.9rem}

/* ENVELOPPE D'INTRO */
body.lock{overflow:hidden;height:100vh}
#intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,var(--bordeaux-2),#22060c 75%);
  transition:opacity 1.2s ease,visibility 1.2s;perspective:1100px}
#intro.gone{opacity:0;visibility:hidden}
.env-scene{text-align:center;transition:transform .15s ease-out;transform-style:preserve-3d}
.envelope{position:relative;width:min(330px,80vw);height:min(220px,53vw);margin:0 auto;cursor:pointer;
  transform-style:preserve-3d;animation:floaty 3.2s ease-in-out infinite;
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
@keyframes floaty{50%{transform:translateY(-14px) rotateZ(-1deg)}}
.envelope>div{position:absolute}
.env-back{inset:0;background:#7a1629;border-radius:8px}
.letter{left:7%;width:86%;top:8%;height:88%;background:var(--creme);border-radius:6px;z-index:1;
  display:grid;place-items:center;color:#4a0e1a;font-family:'Great Vibes',cursive;font-size:2rem;
  transition:transform 1.1s cubic-bezier(.3,1.2,.4,1) .7s;box-shadow:0 0 0 2px rgba(227,182,106,.5) inset}
.pocket-l,.pocket-r,.pocket-b{inset:0;z-index:3}
.pocket-l{background:#8c1a30;clip-path:polygon(0 0,52% 52%,0 100%);border-radius:8px 0 0 8px}
.pocket-r{background:#8c1a30;clip-path:polygon(100% 0,48% 52%,100% 100%);border-radius:0 8px 8px 0}
.pocket-b{background:#a42239;clip-path:polygon(0 100%,50% 44%,100% 100%);border-radius:0 0 8px 8px}
.flap{left:0;right:0;top:0;height:58%;background:linear-gradient(#b02a42,#8c1a30);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;z-index:4;
  transition:transform .9s cubic-bezier(.5,0,.3,1),z-index 0s .45s}
.seal{left:50%;top:44%;width:56px;height:56px;margin:-4px 0 0 -28px;border-radius:50%;z-index:6;
  background:radial-gradient(circle at 35% 30%,#e8505f,#8a0f22 70%);color:#ffd9a0;
  display:grid;place-items:center;font-size:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:opacity .4s,transform .4s}
.envelope.open .flap{transform:rotateX(180deg);z-index:0}
.envelope.open .letter{transform:translateY(-62%)}
.envelope.open .seal{opacity:0;transform:scale(.3)}
.env-hint{margin-top:50px;color:var(--rose);letter-spacing:.25em;text-transform:uppercase;font-size:.8rem;animation:blink 1.6s infinite}
.env-title{font-family:'Great Vibes',cursive;color:var(--or);font-size:clamp(2rem,7vw,3rem);margin-bottom:40px}
</style>
</head>
<body class="lock">

<div id="intro">
  <div class="env-scene" id="scene">
    <div class="env-title">Une lettre pour toi…</div>
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="letter">Pour toi 💌</div>
      <div class="pocket-l"></div><div class="pocket-r"></div><div class="pocket-b"></div>
      <div class="flap"></div>
      <div class="seal">❤</div>
    </div>
    <div class="env-hint" id="envHint">Touche pour ouvrir</div>
  </div>
</div>

<canvas id="confetti"></canvas>
<div id="petals"></div>

<!-- HERO -->
<section id="hero">
  <p class="sub">Aujourd'hui, on célèbre</p>
  <h1>Joyeux<br>Anniversaire</h1>
  <div class="name" id="name"></div>
  <div class="age" id="age"></div>
  <button class="btn" id="party">🎉 Cliquer pour faire la fête</button>
  <div class="scroll">⌄</div>
</section>

<!-- CALENDRIER -->
<section>
  <h2 class="reveal">Le grand jour</h2>
  <div class="cal reveal" id="cal"></div>
</section>

<!-- GATEAU -->
<section>
  <h2 class="reveal">Fais un vœu</h2>
  <div class="cake reveal" id="cake">
    <div class="candles"><div class="candle"><div class="flame"></div></div><div class="candle"><div class="flame"></div></div><div class="candle"><div class="flame"></div></div></div>
    <div class="layer l3"></div><div class="layer l2"></div><div class="layer l1"></div>
  </div>
  <p class="hint reveal">Clique sur le gâteau pour souffler les bougies 🕯️</p>
</section>

<!-- PHOTOS -->
<section>
  <h2 class="reveal">Nos souvenirs</h2>
  <div class="gallery" id="gallery"></div>
</section>

<!-- MESSAGE -->
<section>
  <h2 class="reveal">Pour toi</h2>
  <div class="card reveal"><span id="msg"></span><span class="caret"></span></div>
</section>

<footer>Fait avec ❤️ pour toi</footer>
<div id="lightbox"><img alt=""></div>

<script>
/* =====================  ✏️ À MODIFIER ICI  ===================== */
const CONFIG = {
  name: "Maria",            // ← son prénom
  birth: "2002-11-04",                     // ← date de naissance AAAA-MM-JJ
  message:
`Joyeux anniversaire Maria ! 🎂
Je t'aime beaucoup ❤️
Tu es ma meilleure amie, et je te souhaite plein de succès,
de bonheur et de belles choses dans ta vie.
Inshallah on sera toujours l'une à côté de l'autre.
Profite à fond de ta journée, tu le mérites !
Never stop shining !

Bouchra`,
  // ← remplace "" par le chemin de ta photo, ex: "photos/1.jpg" (mets tes images dans un dossier "photos")
photos: [
  { src: "1.jpeg", caption: "Notre souvenir" },
  { src: "2.jpeg", caption: "Celle-là, on la refait !" }
]
};
/* =============================================================== */

const $ = s => document.querySelector(s);
const [by, bm, bd] = CONFIG.birth.split("-").map(Number);
const now = new Date();
const year = 2026; // année de l'anniversaire affiché (24 ans)
$("#name").textContent = CONFIG.name;
$("#age").textContent = year - by;


/* Calendrier */
(function(){
  const mois = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const first = new Date(year, bm-1, 1);
  const offset = (first.getDay()+6)%7;
  const days = new Date(year, bm, 0).getDate();
  let h = `<div class="cal-head">${mois[bm-1]} ${year}</div><div class="grid">`;
  ["L","M","M","J","V","S","D"].forEach(x=>h+=`<div class="dow">${x}</div>`);
  for(let i=0;i<offset;i++) h+="<div></div>";
  for(let d=1; d<=days; d++){
    const cls = d===bd ? "bday" : (new Date(year,bm-1,d) < new Date(now.getFullYear(),now.getMonth(),now.getDate()) ? "past":"");
    h+=`<div class="day ${cls}">${d}</div>`;
  }
  $("#cal").innerHTML = h+"</div>";
  document.querySelector(".day.bday").addEventListener("click", party);
})();

/* Galerie (placeholders si pas de photo) */
function placeholder(i){
  const c=[["#9b1c31","#4a0e1a"],["#e8a0ab","#9b1c31"],["#6d1426","#2a0710"]][i%3];
  const e=["💖","🌹","🥂","🎀","✨","🍰"][i%6];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${c[0]}'/><stop offset='1' stop-color='${c[1]}'/></linearGradient></defs><rect width='400' height='400' fill='url(#g)'/><text x='200' y='235' font-size='130' text-anchor='middle'>${e}</text></svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}
$("#gallery").innerHTML = CONFIG.photos.map((p,i)=>
  `<figure class="polaroid reveal" style="--r:${(i%2?1:-1)*(2+i%3)}deg"><img src="${p.src||placeholder(i)}" alt="${p.caption}"><p>${p.caption}</p></figure>`).join("");
const lb=$("#lightbox");
document.querySelectorAll(".polaroid").forEach(f=>f.onclick=()=>{lb.querySelector("img").src=f.querySelector("img").src;lb.classList.add("on")});
lb.onclick=()=>lb.classList.remove("on");

/* Pétales */
(function(){
  const box=$("#petals"), items=["🌹","❤️","🥀","💮"];
  for(let i=0;i<22;i++){
    const s=document.createElement("span");
    s.className="petal"; s.textContent=items[i%items.length];
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(12+Math.random()*18)+"px";
    s.style.animationDuration=(9+Math.random()*12)+"s";
    s.style.animationDelay=(-Math.random()*20)+"s";
    box.appendChild(s);
  }
})();

/* Confettis */
const cv=$("#confetti"), ctx=cv.getContext("2d"); let parts=[], run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight} size(); addEventListener("resize",size);
function party(){
  const cols=["#e3b66a","#9b1c31","#e8a0ab","#fff4ec","#6d1426"];
  for(let i=0;i<220;i++) parts.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*18,vy:Math.random()*-16-4,
    s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});
  if(!run){run=true;loop()}
}
function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});
  parts=parts.filter(p=>p.y<cv.height+30);
  parts.length?requestAnimationFrame(loop):(run=false,ctx.clearRect(0,0,cv.width,cv.height));
}
$("#party").onclick=party;
$("#cake").onclick=function(){ this.classList.toggle("out"); if(this.classList.contains("out")) party(); };

/* Enveloppe 3D */
(function(){
  const env=$("#envelope"), scene=$("#scene"), intro=$("#intro");
  let opened=false;
  intro.addEventListener("pointermove",e=>{
    if(opened) return;
    const x=(e.clientX/innerWidth-.5), y=(e.clientY/innerHeight-.5);
    scene.style.transform=`rotateY(${x*28}deg) rotateX(${-y*22}deg)`;
  });
  env.addEventListener("click",()=>{
    if(opened) return; opened=true;
    scene.style.transform="rotateX(8deg)";
    $("#envHint").style.display="none";
    env.style.animation="none";
    env.classList.add("open");
    setTimeout(()=>{ party(); },2600);
    setTimeout(()=>{ intro.classList.add("gone"); document.body.classList.remove("lock"); },3000);
  });
})();

/* Apparition au scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");io.unobserve(e.target)}}),{threshold:.2});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

/* Message machine à écrire */
(function(){
  const el=$("#msg"); let i=0, started=false;
  const start=()=>{ if(started) return; started=true;
    (function t(){ el.innerHTML=CONFIG.message.slice(0,i).replace(/\n/g,"<br>"); if(i++<CONFIG.message.length) setTimeout(t,45) })(); };
  new IntersectionObserver((es,o)=>{ if(es[0].isIntersecting){start();o.disconnect()} },{threshold:.4}).observe($(".card"));
})();
</script>
</body>
</html>
